<body>

  <!-- 桌面侧栏 -->

</div>

<!-- 移动底栏 -->
<nav class="tabbar" id="tabbar"></nav>

<!-- PWA 安装提示 -->
<div id="pwa_install_banner" style="display:none;position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:90%;max-width:440px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);padding:12px 16px;display:none;align-items:center;gap:10px;z-index:9999">
  <div style="font-size:24px">📲</div>
  <div style="flex:1"><div style="font-weight:600;font-size:14px">安装到手机桌面</div><div style="font-size:12px;color:#666">离线可用，像App一样打开</div></div>
  <button id="pwa_install_btn" style="background:#0e9488;color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:13px;white-space:nowrap">安装</button>
  <button id="pwa_install_close" style="background:none;border:none;font-size:18px;color:#999;padding:0 4px">×</button>
</div>

<script src="js/utils/esc.js"></script>

<script src="js/views/schedule.js"></script>
<script src="js/views/records.js"></script>
<script src="js/views/patients.js"></script>
<script src="js/views/patient-detail.js"></script>
<script src="js/views/todo.js"></script>
<script src="js/views/assess.js"></script>
<script src="js/views/scale.js"></script>
<script src="js/views/plan.js"></script>
<script src="js/views/fee.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/router.js"></script>
<script src="js/bootstrap.js"></script>

<script>
/* PWA 注册 - 支持自动更新 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').then(function(registration) {
      console.log('Service Worker 已注册, scope:', registration.scope);
      
      registration.addEventListener('updatefound', function() {
        var newWorker = registration.installing;
        console.log('发现新的 Service Worker');
        
        newWorker.addEventListener('statechange', function() {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            console.log('新 SW 已安装，正在激活...');
            newWorker.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    }).catch(function(err) {
      console.log('SW 注册失败：', err);
    });
    
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });
  });
}

/* 桌面/安卓安装提示 */
var deferredPrompt = null;
var banner = document.getElementById('pwa_install_banner');
var installBtn = document.getElementById('pwa_install_btn');
var closeBtn = document.getElementById('pwa_install_close');

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  banner.style.display = 'flex';
});

window.addEventListener('appinstalled', function() {
  deferredPrompt = null;
  banner.style.display = 'none';
});

installBtn && installBtn.addEventListener('click', function() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choice) {
      if (choice.outcome === 'accepted') {
        console.log('用户已同意安装');
      } else {
        console.log('用户拒绝安装');
      }
      deferredPrompt = null;
      banner.style.display = 'none';
    });
  }
});

closeBtn && closeBtn.addEventListener('click', function() {
  banner.style.display = 'none';
});
</script>
</body>
</html>

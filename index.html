<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="个人康复工作台">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="个人康复工作台 · 治疗师一站式日程 / 患者 / 评估 / 量表 / 方案">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>个人康复工作台</title>
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">康</div>
      <div>
        <div class="bn">个人康复工作台</div>
        <div class="bs">Rehab Workbench</div>
      </div>
    </div>
    <nav class="nav" id="navDesk"></nav>
    <div class="side-foot" id="sideFootDesk"></div>
  </aside>

  <div class="m-drawer" id="mDrawer" style="display:none">
    <div class="m-backdrop" data-close-drawer></div>
    <div class="m-panel">
      <div class="brand">
        <div class="logo">康</div>
        <div>
          <div class="bn">个人康复工作台</div>
          <div class="bs">Rehab Workbench</div>
        </div>
      </div>
      <nav class="nav" id="navMobile"></nav>
      <div class="side-foot" id="sideFootMobile"></div>
    </div>
  </div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn hamburger" id="hamburger" aria-label="菜单"></button>
      <div class="page-title" id="pageTitle">今日概览</div>
      <div class="search">
        <span class="ic" id="searchIc"></span>
        <input id="globalSearch" type="text" placeholder="搜索患者、量表、方案…">
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnNotify" aria-label="通知"><span class="dot"></span></button>
        <button class="icon-btn" id="btnPlus" aria-label="新增"></button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>

</div>

<nav class="tabbar" id="tabbar"></nav>
<button class="fab" id="fab" aria-label="新增"></button>

<div id="pwa_install_banner" style="display:none;position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:90%;max-width:440px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:9999">
  <div style="font-size:24px">📲</div>
  <div style="flex:1"><div style="font-weight:600;font-size:14px">安装到手机桌面</div><div style="font-size:12px;color:#666">离线可用，像App一样打开</div></div>
  <button id="pwa_install_btn" style="background:#0e9488;color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:13px;white-space:nowrap">安装</button>
  <button id="pwa_install_close" style="background:none;border:none;font-size:18px;color:#999;padding:0 4px">×</button>
</div>

<script>
(function() {
  var SCRIPTS = [
    'js/utils/esc.js',
    'js/utils/date.js',
    'js/utils/export.js',
    'js/schema.js',
    'js/storage.js',
    'js/state.js',
    'js/seed.js',
    'js/components/icons.js',
    'js/components/toast.js',
    'js/components/modal.js',
    'js/components/shell.js',
    'js/views/dashboard.js',
    'js/views/schedule.js',
    'js/views/records.js',
    'js/views/patients.js',
    'js/views/patient-detail.js',
    'js/views/todo.js',
    'js/views/assess.js',
    'js/views/scale.js',
    'js/views/plan.js',
    'js/views/fee.js',
    'js/views/settings.js',
    'js/router.js',
    'js/bootstrap.js'
  ];

  function loadScript(src) {
    return new Promise(function(resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.async = false;
      s.onload = resolve;
      s.onerror = function() { reject(new Error('Failed to load: ' + src)); };
      document.head.appendChild(s);
    });
  }

  async function boot() {
    for (var i = 0; i < SCRIPTS.length; i++) {
      try {
        await loadScript(SCRIPTS[i]);
      } catch (err) {
        console.error('Script load failed:', SCRIPTS[i], err);
      }
    }
    console.log('[Loader] All scripts loaded. Storage:', typeof window.RehabStorage);
  }

  boot();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw-v8.js').then(function(registration) {
      console.log('[PWA] Service Worker registered, scope:', registration.scope);

      registration.addEventListener('updatefound', function() {
        var newWorker = registration.installing;
        console.log('[PWA] New SW found');

        newWorker.addEventListener('statechange', function() {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            console.log('[PWA] New SW installed, activating...');
            newWorker.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    }).catch(function(err) {
      console.log('[PWA] SW registration failed:', err);
    });

    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });
  });
}

var deferredPrompt = null;
var banner = document.getElementById('pwa_install_banner');
var installBtn = document.getElementById('pwa_install_btn');
var closeBtn = document.getElementById('pwa_install_close');

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  banner.style.display = 'flex';
});

window.addEventListener('appinstalled', function() {
  deferredPrompt = null;
  banner.style.display = 'none';
});

installBtn && installBtn.addEventListener('click', function() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choice) {
      if (choice.outcome === 'accepted') {
        console.log('[PWA] User accepted install');
      } else {
        console.log('[PWA] User dismissed install');
      }
      deferredPrompt = null;
      banner.style.display = 'none';
    });
  }
});

closeBtn && closeBtn.addEventListener('click', function() {
  banner.style.display = 'none';
});
</script>
</body>
</html>

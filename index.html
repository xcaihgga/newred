<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3182ce">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="康复评估">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="康复治疗师评估记录系统 - 患者管理/评估/量表/康复方案/拍照记录">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>康复评估系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#f0f2f5;color:#333;line-height:1.5;font-size:14px}
:root{--primary:#3182ce;--primary-dark:#2c5282;--bg:#f0f2f5;--card:#fff;--radius:8px}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:inherit;font-size:14px;outline:none}
a{text-decoration:none;color:inherit}

/* app container */
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom));background:var(--bg)}
.page{padding:12px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* header */
.page-header{background:linear-gradient(135deg,#3182ce,#2c5282);color:#fff;padding:16px 14px;border-radius:var(--radius);margin-bottom:12px}
.page-header h2{font-size:18px;font-weight:600}
.page-header p{font-size:12px;opacity:.9;margin-top:2px}

/* card */
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-title{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.card-title .more{font-size:12px;color:var(--primary);font-weight:400}

/* stat grid */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:var(--card);border-radius:var(--radius);padding:14px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-box .num{font-size:22px;font-weight:700;color:var(--primary)}
.stat-box .lbl{font-size:12px;color:#888;margin-top:2px}

/* grid menu */
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.type-item{background:var(--card);border-radius:var(--radius);padding:14px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:.2s}
.type-item:active{transform:scale(.96)}
.type-item .icon{font-size:24px}
.type-item .name{font-size:12px;margin-top:4px;color:#555}

/* patient card */
.patient-card{background:var(--card);border-radius:var(--radius);padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex-shrink:0}
.patient-info{flex:1;min-width:0}
.patient-info .pn{font-weight:600;font-size:15px}
.patient-info .pm{font-size:12px;color:#888;margin-top:2px}
.patient-info .pm span{margin-right:8px}
.row-actions{display:flex;gap:6px}
.btn-mini{padding:4px 10px;border-radius:6px;font-size:12px;background:#edf2f7;color:var(--primary)}
.btn-mini.danger{color:#e53e3e;background:#fed7d7}

/* record card */
.record-card{background:var(--card);border-radius:var(--radius);padding:10px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;gap:10px}
.record-thumb{width:72px;height:72px;border-radius:6px;object-fit:cover;background:#edf2f7;flex-shrink:0}
.record-info{flex:1;min-width:0}
.record-info .rn{font-weight:600;font-size:13px;color:var(--primary)}
.record-info .rm{font-size:12px;color:#666;margin-top:3px}
.record-info .rt{font-size:11px;color:#aaa;margin-top:4px}

/* form */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:#555;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;font-size:14px}
.form-group textarea{resize:vertical;min-height:70px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
.gender-pick{display:flex;gap:10px}
.gender-pick label{flex:1;text-align:center;padding:10px;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;margin:0}
.gender-pick input{display:none}
.gender-pick input:checked+span{color:var(--primary);font-weight:600}
.gender-pick label:has(input:checked){border-color:var(--primary);background:#ebf8ff}

/* buttons */
.btn{display:block;width:100%;padding:12px;background:var(--primary);color:#fff;border-radius:6px;font-size:15px;font-weight:600;text-align:center}
.btn:active{opacity:.85}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn-danger{background:#e53e3e}
.btn-block{display:block;width:100%;padding:11px;text-align:center;border-radius:6px;font-size:14px;font-weight:600}

/* tab bar */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 6px rgba(0,0,0,.08);z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#888;position:relative;cursor:pointer}
.tab .ic{font-size:20px;margin-bottom:2px}
.tab.on{color:var(--primary)}
.tab-camera{flex:1;display:flex;align-items:flex-start;justify-content:center}
.cam-btn{width:54px;height:54px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-22px;box-shadow:0 4px 10px rgba(49,130,206,.5);border:3px solid #fff}
.cam-btn:active{transform:scale(.94)}

/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:12px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto}
.modal-hd{padding:16px;font-size:16px;font-weight:600;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.modal-hd .close{font-size:22px;color:#aaa;cursor:pointer;line-height:1}
.modal-bd{padding:16px}
.modal-ft{padding:12px 16px;border-top:1px solid #eee;display:flex;gap:10px}
.modal-ft .btn{flex:1}

/* toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;z-index:300;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

/* empty */
.empty{text-align:center;padding:40px 20px;color:#aaa}
.empty .ei{font-size:40px;margin-bottom:8px}

/* photo preview */
.photo-preview{width:100%;border-radius:var(--radius);display:block;margin-bottom:12px;background:#edf2f7}

/* detail */
.detail-photo{width:100%;border-radius:var(--radius);display:block;margin-bottom:12px}
.info-row{display:flex;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.info-row .k{width:90px;color:#888;flex-shrink:0}
.info-row .v{flex:1;font-weight:500;word-break:break-all}

/* bar chart */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:8px 0;border-bottom:1px solid #eee;margin:10px 0}
.bar-col{flex:1;background:var(--primary);border-radius:3px 3px 0 0;min-height:2px;position:relative;transition:height .4s}
.bar-col .lab{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:#888}
.bar-col .val{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--primary);font-weight:600}
.bar-wrap{margin-top:24px}
.hbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.hbar .nl{width:60px;flex-shrink:0;color:#555}
.hbar .track{flex:1;height:18px;background:#edf2f7;border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--primary);border-radius:4px;transition:width .5s}
.hbar .nm{width:32px;text-align:right;color:#888;flex-shrink:0}

.filter-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}
.filter-row .form-group{flex:1;margin-bottom:0}
.date-input{padding:8px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;width:100%}

.qr-canvas{display:block;margin:10px auto;background:#fff}
.cert-card{border:2px solid var(--primary);border-radius:10px;padding:16px;text-align:center}
.cert-card h3{color:var(--primary);margin-bottom:8px}
.cert-info{text-align:left;font-size:13px;margin:10px 0}
.cert-info .ir{padding:5px 0;border-bottom:1px dashed #e2e8f0}
.cert-info .ir .k{color:#888;display:inline-block;width:80px}
.onboard-welcome{text-align:center;padding:10px 0}
.onboard-welcome .logo{font-size:48px;margin-bottom:8px}
.list-link{display:block;padding:10px;background:#fff;border-radius:6px;margin-bottom:8px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.04);display:flex;justify-content:space-between;align-items:center}
.link-arrow{color:#aaa}

/* ==================== New module styles ==================== */
/* search box */
.search-box{position:relative;margin-bottom:12px}
.search-box input{width:100%;padding:10px 12px 10px 34px;border:1px solid #e2e8f0;border-radius:20px;background:#fff;font-size:14px}
.search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aaa;font-size:14px}

/* patient detail header */
.patient-detail-hd{background:linear-gradient(135deg,#3182ce,#2c5282);color:#fff;padding:16px;border-radius:var(--radius);margin-bottom:12px}
.patient-detail-hd .pname{font-size:20px;font-weight:700}
.patient-detail-hd .pmeta{font-size:12px;opacity:.9;margin-top:4px}
.patient-detail-hd .pmeta span{margin-right:10px}
.patient-detail-hd .pid{font-size:11px;opacity:.8;margin-top:6px;font-family:monospace}

/* function entry grid (6 cards) */
.func-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.func-item{background:#fff;border-radius:var(--radius);padding:14px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;transition:.2s}
.func-item:active{transform:scale(.96)}
.func-item .fic{font-size:26px}
.func-item .fname{font-size:12px;margin-top:4px;color:#555}

/* section card with collapsible */
.section-card{background:#fff;border-radius:var(--radius);margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.section-card .sc-hd{padding:12px 14px;background:#f7fafc;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:1px solid #eee}
.section-card .sc-hd .arrow{transition:.2s;color:#aaa}
.section-card.collapsed .arrow{transform:rotate(-90deg)}
.section-card .sc-bd{padding:14px}
.section-card.collapsed .sc-bd{display:none}

/* sub-section */
.sub-section{border:1px solid #edf2f7;border-radius:6px;padding:12px;margin-bottom:10px}
.sub-section .ss-title{font-weight:600;font-size:13px;color:var(--primary);margin-bottom:8px}

/* checkbox / radio pills */
.pill-group{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:6px 12px;border:1px solid #e2e8f0;border-radius:16px;font-size:12px;cursor:pointer;background:#fff;user-select:none}
.pill.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pill-radio{display:inline-flex;gap:0;border:1px solid #e2e8f0;border-radius:6px;overflow:hidden}
.pill-radio label{padding:6px 10px;font-size:12px;cursor:pointer;background:#fff}
.pill-radio input{display:none}
.pill-radio input:checked+span{color:#fff}
.pill-radio label:has(input:checked){background:var(--primary);color:#fff}

/* slider */
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type=range]{flex:1}
.slider-row .sv{font-weight:700;color:var(--primary);min-width:30px;text-align:center}

/* dynamic list item */
.dyn-item{border:1px solid #edf2f7;border-radius:6px;padding:10px;margin-bottom:8px;background:#fafbfc}
.dyn-item .di-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;color:#888}
.dyn-item .di-rm{color:#e53e3e;cursor:pointer;font-size:12px}

/* joint rom table */
.rom-row{display:grid;grid-template-columns:80px 1fr 1fr;gap:6px;margin-bottom:6px;font-size:12px}
.rom-row .rom-cell{display:flex;flex-direction:column;gap:2px}
.rom-row .rom-cell label{font-size:11px;color:#888}
.rom-row .rom-cell input{padding:6px;font-size:12px;border:1px solid #e2e8f0;border-radius:4px}

/* category group */
.cat-group{margin-bottom:14px}
.cat-group .cat-title{font-weight:600;font-size:13px;color:#444;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--primary)}
.exam-row{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #edf2f7;border-radius:6px;margin-bottom:6px;background:#fff;flex-wrap:wrap}
.exam-row .ex-name{flex:1;min-width:120px;font-size:13px;font-weight:500}
.exam-row .ex-result{display:flex;gap:0}
.exam-row .ex-result label{padding:4px 8px;font-size:11px;border:1px solid #e2e8f0;cursor:pointer;background:#fff}
.exam-row .ex-result label:first-child{border-radius:4px 0 0 4px}
.exam-row .ex-result label:last-child{border-radius:0 4px 4px 0}
.exam-row .ex-result input{display:none}
.exam-row .ex-result input:checked+span{color:#fff}
.exam-row .ex-result label:has(input:checked){background:var(--primary);color:#fff;border-color:var(--primary)}
.exam-row .ex-result label.pos:has(input:checked){background:#e53e3e;border-color:#e53e3e}
.exam-row .ex-result label.neg:has(input:checked){background:#38a169;border-color:#38a169}
.exam-row .ex-note{width:100%;padding:5px 8px;font-size:11px;border:1px solid #e2e8f0;border-radius:4px;margin-top:4px}

/* tag badges */
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#edf2f7;color:#555;margin:2px}
.tag.pos{background:#fed7d7;color:#c53030}
.tag.neg{background:#c6f6d5;color:#276749}
.tag.warn{background:#feebc8;color:#c05621}
.tag.ok{background:#bee3f8;color:#2c5282}

/* scale card */
.scale-card{border:1px solid #edf2f7;border-radius:8px;padding:12px;margin-bottom:10px;background:#fff}
.scale-card .sc-name{font-weight:600;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.scale-card .sc-score{font-size:18px;font-weight:700;color:var(--primary)}
.scale-card .sc-conclusion{font-size:12px;color:#666;margin-top:4px;padding:6px;background:#f7fafc;border-radius:4px}
/* 量表库参考 */
.lib-info{font-size:12px;color:#555;background:#f7fafc;border-radius:6px;padding:8px 10px;margin-bottom:8px}
.lib-info .li-row{margin:2px 0}
.lib-cat{margin-bottom:6px;border:1px solid #edf2f7;border-radius:6px;overflow:hidden}
.lib-cat-hd{background:#ebf8ff;padding:8px 10px;font-weight:600;font-size:13px;cursor:pointer;color:#2c5282;user-select:none}
.lib-cat-bd{padding:4px 10px}
.lib-item{border-bottom:1px solid #f0f0f0;padding:8px 0}
.lib-item:last-child{border-bottom:none}
.lib-item .li-name{font-weight:600;font-size:13px;color:#333;margin-bottom:3px}
.lib-item .li-row{font-size:12px;color:#555;line-height:1.6}
.lib-item .li-row b{color:#2c5282}

/* plan stage */
.plan-stage{border-left:3px solid var(--primary);padding-left:12px;margin-bottom:14px}
.plan-stage.acute{border-color:#e53e3e}
.plan-stage.subacute{border-color:#dd6b20}
.plan-stage.chronic{border-color:#38a169}
.plan-stage .ps-title{font-weight:600;font-size:14px;margin-bottom:6px}

/* treatment item */
.treat-item{background:#f7fafc;border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px}
.treat-item .ti-name{font-weight:600;color:#333}
.treat-item .ti-meta{color:#888;margin-top:2px}

/* report */
.report-page{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.report-section{margin-bottom:18px;page-break-inside:avoid}
.report-section h3{font-size:15px;color:var(--primary);border-bottom:2px solid var(--primary);padding-bottom:6px;margin-bottom:10px}
.report-section .r-row{display:flex;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.report-section .r-row .rk{width:100px;color:#888;flex-shrink:0}
.report-section .r-row .rv{flex:1}
.report-section .r-block{background:#f7fafc;padding:8px;border-radius:4px;margin-top:6px;font-size:12px;color:#555}
.report-title{text-align:center;font-size:20px;font-weight:700;margin-bottom:6px}
.report-sub{text-align:center;color:#888;font-size:12px;margin-bottom:16px}

/* role badge */
.role-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;background:#fed7d7;color:#c53030}
.role-badge.admin{background:#fed7d7;color:#c53030}
.role-badge.director{background:#feebc8;color:#c05621}
.role-badge.therapist{background:#bee3f8;color:#2c5282}

/* tab bar 6 items (no camera) */
#tabbar .tab{font-size:10px}

/* filter chips */
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:5px 12px;border:1px solid #e2e8f0;border-radius:14px;font-size:12px;cursor:pointer;background:#fff}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}

/* step nav */
.step-nav{display:flex;background:#fff;border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.step-nav .sn-item{flex:1;padding:10px 4px;text-align:center;font-size:11px;color:#888;cursor:pointer;border-bottom:2px solid transparent}
.step-nav .sn-item.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* patient selector */
.patient-select-list{max-height:300px;overflow-y:auto}
.patient-select-list .ps-item{padding:10px;border:1px solid #edf2f7;border-radius:6px;margin-bottom:6px;cursor:pointer}
.patient-select-list .ps-item:active{background:#ebf8ff}

/* alert */
.alert{padding:8px 12px;border-radius:6px;font-size:12px;margin:6px 0}
.alert.warn{background:#feebc8;color:#c05621}
.alert.danger{background:#fed7d7;color:#c53030}
.alert.info{background:#bee3f8;color:#2c5282}

/* treatment item price & enhanced card */
.ti-desc{margin-top:6px;font-size:12px;color:#2d3748;padding:6px 8px;background:#edf2f7;border-radius:4px;line-height:1.5}
.ti-desc b{color:#2b6cb0}
.treat-item{background:#f7fafc;border-radius:8px;padding:10px;margin-bottom:8px}
.di-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.ti-name{font-weight:600;font-size:14px}
.ti-meta{font-size:12px;color:#666;margin-top:4px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;background:#ebf8ff;color:#3182ce;border-radius:3px;margin-left:4px;font-weight:400}

/* price query table */
.price-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.price-table th{background:#ebf8ff;color:#2c5282;padding:8px 6px;text-align:left;font-weight:600;border-bottom:2px solid #bee3f8}
.price-table td{padding:8px 6px;border-bottom:1px solid #edf2f7;vertical-align:top}
.price-table tr:hover td{background:#f7fafc}
.price-table .p3{color:#e53e3e;font-weight:600}
.price-table .cd{color:#666;font-size:11px}

/* report summary table */
.r-summary-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.r-summary-table th{background:#ebf8ff;color:#2c5282;padding:6px;text-align:center;font-weight:600;border:1px solid #bee3f8}
.r-summary-table td{padding:6px;border:1px solid #e2e8f0;text-align:center}
.r-summary-table .total-row td{background:#fff5f5;font-weight:600;color:#e53e3e}

/* print styles */
@media print{
  #tabbar,.no-print{display:none !important}
  #app{max-width:none;padding:0}
  .report-page{font-size:12pt;box-shadow:none;border:none}
  .report-section{page-break-inside:avoid}
  body{background:#fff}
}
</style>

/* IndexedDB for photos */
var DB = {
  db:null,
  ready:null,
  init:function(){
    var self=this;
    this.ready=new Promise(function(resolve,reject){
      var req=indexedDB.open('TherapyRecordDB',1);
      req.onupgradeneeded=function(e){
        var db=e.target.result;
        if(!db.objectStoreNames.contains('photos')){
          db.createObjectStore('photos',{keyPath:'id'});
        }
      };
      req.onsuccess=function(e){self.db=e.target.result;resolve(self.db)};
      req.onerror=function(e){reject(e.target.error)};
    });
    return this.ready;
  },
  putPhoto:function(id,blob){
    // Require image/* type to prevent arbitrary blob storage / XSS via blob: URLs
    if(!blob||!(blob instanceof Blob)){
      return Promise.reject(new Error('putPhoto: invalid blob'));
    }
    if(blob.type&&blob.type.indexOf('image/')!==0){
      return Promise.reject(new Error('putPhoto: only image/* allowed, got '+blob.type));
    }
    return this.ready.then(function(db){
      return new Promise(function(resolve,reject){
        var tx=db.transaction('photos','readwrite');
        tx.objectStore('photos').put({id:id,blob:blob});
        tx.oncomplete=function(){resolve()};
        tx.onerror=function(){reject(tx.error)};
        tx.onabort=function(){reject(tx.error||new Error('tx aborted'))};
      });
    });
  },
  getPhoto:function(id){
    return this.ready.then(function(db){
      return new Promise(function(resolve,reject){
        var tx=db.transaction('photos','readonly');
        var r=tx.objectStore('photos').get(id);
        r.onsuccess=function(){resolve(r.result?r.result.blob:null)};
        r.onerror=function(){reject(r.error)};
      });
    });
  },
  getAllPhotoIds:function(){
    return this.ready.then(function(db){
      return new Promise(function(resolve,reject){
        var tx=db.transaction('photos','readonly');
        var r=tx.objectStore('photos').getAllKeys();
        r.onsuccess=function(){resolve(r.result||[])};
        r.onerror=function(){reject(r.error)};
      });
    });
  },
  delPhoto:function(id){
    return this.ready.then(function(db){
      return new Promise(function(resolve,reject){
        var tx=db.transaction('photos','readwrite');
        tx.objectStore('photos').delete(id);
        tx.oncomplete=function(){resolve()};
        tx.onerror=function(){reject(tx.error)};
      });
    });
  },
  clear:function(){
    return this.ready.then(function(db){

        tx.objectStore('photos').clear();
        tx.oncomplete=function(){resolve()};
        tx.onerror=function(){reject(tx.error)};

    });
  }
};

/* ========================= Schema Versioning & Migration ========================= */
// Bump on any breaking data-structure change. Add a migrate_X_to_Y branch.
// 存储所有业务数据的 key 白名单，用于清空/体检/诊断导出。
var SCHEMA_VERSION=3;
var SCHEMA_KEY='_schema_version';
var DATA_KEYS=['therapist_profiles','active_profile_id','patients','records','assessments','specialExams','scales','plans','customExams','customScales','userRole','auditLog','pinHash'];

// 返回当前存储 schema 版本（未初始化时为 0）
function getStoredSchemaVersion(){var v=LS.get(SCHEMA_KEY);return (typeof v==='number'&&v>=0)?v:0}

// 迁移：每次升级写一个明确的 from→to 步骤，幂等、可重入
function migrateSchema(from,to){
  var log=[];
  function step(cur,fn){
    if(from<=cur&&to>cur){try{fn();log.push('v'+(cur+1)+':ok')}catch(e){log.push('v'+(cur+1)+':fail '+e.message)}}
  }
  // v0→1: 旧版无 schema，确保 auditLog/pinHash 容器存在
  step(0,function(){
    if(!LS.get('auditLog'))LS.set('auditLog',[]);
    if(!LS.get('pinHash'))LS.set('pinHash','');
  });
  // v1→2: records 缺字段补默认（向后兼容旧导出）
  step(1,function(){
    var rs=getRecords();
    rs.forEach(function(r){
      if(typeof r.photoId==='undefined')r.photoId=null;
      if(typeof r.timestamp!=='number')r.timestamp=Date.now();
    });
    setRecords(rs);
  });
  // v2→3: patients 缺 createdBy 标记为 'legacy'（便于权限判定）
  step(2,function(){
    var ps=getPatients();
    ps.forEach(function(p){if(!p.createdBy)p.createdBy='legacy'});
    setPatients(ps);
  });
  LS.set(SCHEMA_KEY,to);
  console.log('[schema] migrated',from,'→',to,'|',log.join(', '));
  return log;
}

// 启动时自动迁移（包在 try 内，失败不影响加载）
function ensureSchemaMigrated(){
  try{
    var cur=getStoredSchemaVersion();
    if(cur===SCHEMA_VERSION){return{ok:true,from:cur,to:cur,log:['noop']}}
    var before=cur;
    var log=migrateSchema(cur,SCHEMA_VERSION);
    return{ok:true,from:before,to:SCHEMA_VERSION,log:log};
  }catch(e){
    console.error('[schema] migration failed:',e);
    return{ok:false,error:e.message};
  }
}

/* ========================= PIN Protection ========================= */
// 简易哈希（非加密强，但避免明文存 PIN）。PIN 仅前端拦截误操作，不可信。
function pinHash(pin){
  var h=simpleHash('pin_salt_9f3a2::'+String(pin));
  return h;
}
function getPinHash(){return LS.get('pinHash')||''}
function isPinSet(){return !!getPinHash()}
function setPin(pin){
  var h=pin?pinHash(pin):'';
  if(!LS.set('pinHash',h))return false;
  return true;
}
function verifyPin(pin){var h=getPinHash();if(!h)return true;return pinHash(pin)===h}

// PIN 输入弹窗。title=提示，cb=通过回调，onCancel=取消回调
function showPinInput(title,cb,onCancel){
  var mask=document.createElement('div');
  mask.className='modal-mask';
  mask.innerHTML='<div class="modal" style="max-width:340px"><div class="modal-hd"><span>'+escapeHtml(title)+'</span><span class="close">&times;</span></div>'+
    '<div class="modal-bd"><input id="pin_input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="请输入 PIN 码" style="width:100%;padding:12px;font-size:18px;text-align:center;letter-spacing:8px;border:1px solid #e2e8f0;border-radius:6px"></div>'+
    '<div class="modal-ft"><button class="btn btn-ghost" id="pin_cancel">取消</button><button class="btn" id="pin_ok">确定</button></div></div>';
  document.body.appendChild(mask);
  var inp=mask.querySelector('#pin_input');
  setTimeout(function(){inp.focus()},50);
  function close(){mask.remove()}
  function ok(){
    var v=inp.value.trim();
    if(!v){toast('请输入 PIN');return}
    if(verifyPin(v)){close();cb();}else{toast('PIN 码错误');inp.value='';inp.focus();}
  }
  mask.querySelector('.close').onclick=function(){close();if(onCancel)onCancel()};
  mask.querySelector('#pin_cancel').onclick=function(){close();if(onCancel)onCancel()};
  mask.querySelector('#pin_ok').onclick=ok;
  inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();ok()}};
  mask.onclick=function(e){if(e.target===mask){close();if(onCancel)onCancel()}};
}

// 设置/修改 PIN 弹窗。change=true 时要求先验证旧 PIN
function showPinDialog(change){
  if(change&&!isPinSet()){change=false}
  if(change){
    showPinInput('请输入当前 PIN 码',function(){
      _showSetPinForm();
    },function(){toast('已取消')});

    var mask=document.createElement('div');

      '<div class="modal-bd">'+
        '<input id="pin_new1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="4-8 位数字" style="width:100%;padding:12px;font-size:16px;text-align:center;letter-spacing:4px;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:10px">'+
        '<input id="pin_new2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="再次输入" style="width:100%;padding:12px;font-size:16px;text-align:center;letter-spacing:4px;border:1px solid #e2e8f0;border-radius:6px">'+
      '</div>'+
      '<div class="modal-ft"><button class="btn btn-ghost" id="pin_new_cancel">取消</button><button class="btn" id="pin_new_ok">保存</button></div></div>';
    document.body.appendChild(mask);
    var i1=mask.querySelector('#pin_new1'),i2=mask.querySelector('#pin_new2');

    }
    mask.querySelector('.close').onclick=close;
    mask.querySelector('#pin_new_cancel').onclick=close;
    mask.querySelector('#pin_new_ok').onclick=ok;
    i2.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();ok()}};
  }
}

/* Delete a patient and all associated data — 原子操作，失败回滚 */
function deletePatientData(pid){
  var bak_patients=getPatients();
  var bak_records=getRecords();
  var bak_assessments=getAssessments();
  var bak_specialExams=getSpecialExams();
  var bak_scales=getScales();
  var bak_plans=getPlans();
  function rollback(){
    LS.set('patients',bak_patients);
    LS.set('records',bak_records);
    LS.set('assessments',bak_assessments);
    LS.set('specialExams',bak_specialExams);
    LS.set('scales',bak_scales);
    LS.set('plans',bak_plans);
  }
  var arr=bak_patients.filter(function(p){return p.id!==pid});
  if(!LS.set('patients',arr)){rollback();return false}
  var toDel=bak_records.filter(function(r){return r.patientId===pid});
  var rs=bak_records.filter(function(r){return r.patientId!==pid});
  if(!LS.set('records',rs)){rollback();return false}
  toDel.forEach(function(r){if(r.photoId){DB.delPhoto(r.photoId).catch(function(){})}});
  var a=bak_assessments;delete a[pid];
  if(!LS.set('assessments',a)){rollback();return false}
  var se=bak_specialExams;delete se[pid];
  if(!LS.set('specialExams',se)){rollback();return false}
  var sc=bak_scales;delete sc[pid];
  if(!LS.set('scales',sc)){rollback();return false}
  var pl=bak_plans;delete pl[pid];
  if(!LS.set('plans',pl)){rollback();return false}
  // 审计：删除成功后记录
  var deleted=bak_patients.filter(function(p){return p.id===pid})[0];
  audit('patient.delete',{id:pid,name:deleted?deleted.name:'',records:toDel.length});
  return true;
}

  NRS:{name:'NRS数字评分',category:'疼痛评估',type:'number',min:0,max:10,conclusion:function(s){
    if(s<=3)return '轻度疼痛（0-3）';

    return '重度疼痛（7-10）';
  }},
  MPQ:{name:'MPQ简化版',category:'疼痛评估',type:'mpq',conclusion:function(data){
    // data: {sensory:[...5 items 0-3], affective:[...4 items 0-3], eval:1-3}
    var s=(data.sensory||[]).reduce(function(a,b){return a+(+b||0)},0);
    var a=(data.affective||[]).reduce(function(a2,b){return a2+(+b||0)},0);
    var total=s+a;
    var lvl=total<=10?'轻度':(total<=20?'中度':'重度');
    return 'PRI总分 '+total+'（感觉项'+s+' + 情感项'+a+'） - '+lvl+'疼痛';
  }},
  Barthel:{name:'Barthel指数',category:'功能与生活能力',type:'barthel',max:100,conclusion:function(score){
    if(score>60)return '独立（>60分）';
    if(score>=41)return '轻度依赖（41-60分）';
    if(score>=21)return '中度依赖（21-40分）';
    return '完全依赖（≤20分）';
  }},
  Walk6Min:{name:'6分钟步行试验',category:'心肺评估',type:'walk',conclusion:function(dist){
    dist=+dist||0;
    if(dist<150)return '重度心功能不全（<150m）';

    if(dist<450)return '轻度心功能不全（300-450m）';
    return '心功能正常（>450m）';
  }}

function pad(n){return n<10?'0'+n:''+n}
function fmtTime(ts){
  var d=new Date(ts);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
function roundToHalfHour(ts){
  var d=new Date(ts);
  var m=d.getMinutes();
  d.setMinutes(m<30?0:30);
  d.setSeconds(0);
  return d.getTime();
}
function fmtTimeShort(ts){
  var d=new Date(ts);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function fmtDate(ts){
  var d=new Date(ts);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function todayStr(){

}
function genRecordNo(ts){
  var d=new Date(ts);
  return 'TR-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function simpleHash(str){
  var h=5381,i;
  for(i=0;i<str.length;i++){h=((h<<5)+h)+str.charCodeAt(i);h=h&h}
  var hex=(h>>>0).toString(16);
  while(hex.length<16){hex='0'+hex}
  return hex.slice(0,16);
}
function escapeHtml(s){
  if(s==null)s='';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* toast & confirm modal */
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},1800)}
/* guard save button against double-click race (sync & async) */
function wrapSaveEl(el){
  if(!el||!el.onclick)return;
  var orig=el.onclick;
  el.onclick=function(){
    if(el.dataset.busy)return;
    el.dataset.busy='1';el.disabled=true;
    var reset=function(){el.dataset.busy='';el.disabled=false};
    var r;
    try{r=orig.apply(this,arguments)}
    catch(e){reset();throw e}
    if(r&&typeof r.then==='function'){r.then(reset,reset)}
    else{
      // sync handler: add minimal visual lockout (150ms) to catch double-tap race
      setTimeout(reset,150);
    }
  };
}
function wrapSave(id){wrapSaveEl(document.getElementById(id))}
function confirmDialog(msg,cb){

  document.body.appendChild(mask);
  mask.querySelector('#cfNo').onclick=function(){mask.remove()};

  mask.onclick=function(e){if(e.target===mask)mask.remove()};
}

    }catch(e){

        navigator.clipboard.writeText(text).then(function(){toast('已复制')}).catch(function(){toast('复制失败，请手动选择')});
      }else{toast('请手动选择文本复制')}
    }
  };
  mask.querySelector('#share_img').onclick=function(){
    // render text to canvas image
    var lines=text.split('\n');
    var canvas=document.createElement('canvas');
    var ctx=canvas.getContext('2d');
    var fontSize=14;
    var lineH=20;
    var padX=30,padY=30;
    var maxWidth=0;
    ctx.font=fontSize+'px sans-serif';
    lines.forEach(function(line){
      var w=ctx.measureText(line).width;
      if(w>maxWidth)maxWidth=w;
    });
    canvas.width=Math.ceil(maxWidth)+padX*2;
    canvas.height=lines.length*lineH+padY*2+40;
    // background
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // title bar
    ctx.fillStyle='#3182ce';
    ctx.fillRect(0,0,canvas.width,36);
    ctx.fillStyle='#fff';
    ctx.font='bold 16px sans-serif';
    ctx.fillText(title,padX,24);
    // text
    ctx.fillStyle='#333';
    ctx.font=fontSize+'px sans-serif';
    var y=padY+36;
    lines.forEach(function(line){
      ctx.fillText(line,padX,y);
      y+=lineH;
    });
    // footer
    ctx.fillStyle='#999';
    ctx.font='11px sans-serif';
    ctx.fillText('生成时间: '+fmtTime(Date.now()),padX,y+10);
    // download
    canvas.toBlob(function(blob){
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;
      a.download=title.replace(/[\s\/]/g,'_')+'_'+todayStr()+'.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){try{URL.revokeObjectURL(url)}catch(_){}},5000);
      toast('图片已保存到手机');
      mask.remove();
    },'image/png');
  };
  mask.onclick=function(e){if(e.target===mask)mask.remove()};
}

/* ========================= Watermark ========================= */
function blobToDataURL(blob,cb){
  var fr=new FileReader();
  fr.onload=function(){cb(fr.result)};
  fr.readAsDataURL(blob);
}
function dataURLToBlob(dataURL){
  var arr=dataURL.split(','),mime=arr[0].match(/:(.*?);/)[1];
  var bstr=atob(arr[1]),n=bstr.length,u8=new Uint8Array(n);
  for(var i=0;i<n;i++){u8[i]=bstr.charCodeAt(i)}
  return new Blob([u8],{type:mime});
}

/* global to hold current capture before save */
var pendingCapture=null;

function addWatermark(imgURL,data,cb){
  var img=new Image();
  img.onload=function(){
    var canvas=document.createElement('canvas');
    var W=img.naturalWidth,H=img.naturalHeight;
    // limit max dimension for performance
    var maxDim=1600;
    var scale=1;
    if(W>maxDim||H>maxDim){scale=maxDim/Math.max(W,H)}
    canvas.width=Math.round(W*scale);
    canvas.height=Math.round(H*scale);
    var ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,canvas.width,canvas.height);

    var barH=Math.max(120,Math.round(canvas.height*0.18));
    // frosted glass effect: capture bottom region into temp canvas, blur, then redraw
    var tmp=document.createElement('canvas');
    tmp.width=canvas.width;
    tmp.height=barH;
    var tctx=tmp.getContext('2d');
    tctx.drawImage(canvas,0,canvas.height-barH,canvas.width,barH,0,0,canvas.width,barH);
    ctx.filter='blur(8px)';
    ctx.drawImage(tmp,0,canvas.height-barH);
    ctx.filter='none';
    // overlay semi-transparent white
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.fillRect(0,canvas.height-barH,canvas.width,barH);
    // top frosted edge line
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.fillRect(0,canvas.height-barH,canvas.width,1.5);

    var pad=Math.round(canvas.width*0.03);
    var fontSize=Math.max(16,Math.round(barH/7.5));
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.font='600 '+fontSize+'px sans-serif';
    ctx.textBaseline='top';
    var lineH=Math.round(fontSize*1.35);
    var x=pad,y=canvas.height-barH+pad*0.6;

    var lines=[
      '📅 '+data.datetime,
      '📍 地点：'+data.location,
      '👨‍⚕️ 治疗师：'+data.therapist+'    🧑 患者：'+data.patient,
      '🏷 类型：'+data.type+'    编号：'+data.recordNo
    ];
    for(var i=0;i<lines.length;i++){
      ctx.fillText(lines[i],x,y+i*lineH);
    }
    // right side small brand
    ctx.font='400 '+Math.round(fontSize*0.7)+'px sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.textAlign='right';
    ctx.fillText('治疗师拍照记录系统',canvas.width-pad,y);

    canvas.toBlob(function(blob){cb(blob,canvas.toDataURL('image/jpeg',0.85))},'image/jpeg',0.9);
  };
  img.onerror=function(){toast('图片加载失败')};
  img.src=imgURL;
}

    });
  }catch(e){snap._error='snapshot failed: '+e.message}
  var pkg={
    exportTime:new Date().toISOString(),
    appVersion:'v2.0',
    schemaVersion:getStoredSchemaVersion(),
    codeSchemaVersion:SCHEMA_VERSION,
    userAgent:navigator.userAgent,
    lastError:_lastError,
    localStorageSnapshot:snap,
    auditLogRecent:(getAuditLog()||[]).slice(0,50),
    recordsCount:getRecords().length,
    patientsCount:getPatients().length
  };
  var blob=new Blob([JSON.stringify(pkg,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='rehab_diagnostic_'+todayStr()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){try{URL.revokeObjectURL(url)}catch(_){}},5000);

}

// 全局未捕获异常：同步 throw / 资源加载失败
window.addEventListener('error',function(e){
  // 过滤跨域脚本错误（仅有 'Script error.'）
  var msg=String(e.message||'');
  if(msg==='Script error.'&&!e.filename)return;
  try{audit('error.global',{msg:msg.slice(0,80),src:String(e.filename||'').slice(0,40)+':'+(e.lineno||0)})}catch(_){}
  console.error('[global error]',e);
});
// 未处理的 Promise rejection
window.addEventListener('unhandledrejection',function(e){
  var reason=e&&e.reason;
  var msg=String((reason&&reason.message)||reason||'');
  try{audit('error.promise',{msg:msg.slice(0,80)})}catch(_){}
  console.error('[unhandledrejection]',reason);
});

function route(path){
  // path like /camera or /record/:id or /camera?type=...
  var qIdx=path.indexOf('?');
  var query={};
  var pure=path;
  if(qIdx>=0){
    pure=path.slice(0,qIdx);
    var qs=path.slice(qIdx+1).split('&');
    qs.forEach(function(p){var kv=p.split('=');query[kv[0]]=decodeURIComponent(kv[1]||'')});
  }
  var parts=pure.split('/').filter(Boolean);
  var key='/'+(parts[0]||'home');
  if(parts[1]){key+='/:id'}
  var fn=routes[key]||routes['/home'];
  renderTabbar(key);
  var param=parts[1]?decodeURIComponent(parts[1]):null;
  clearDirty();
  // 错误边界：路由 handler 异常不白屏，渲染错误页并提供诊断导出
  try{
    fn(param,query);
  }catch(e){
    renderErrorPage(e,path);
    return;
  }
  // add back button to sub-pages
  var hdr=document.querySelector('.page-header');
  if(hdr && parts[1]){
    var backBtn=document.createElement('div');
    backBtn.style.cssText='position:absolute;top:14px;left:10px;font-size:18px;cursor:pointer;color:#fff;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.2)';
    backBtn.innerHTML='‹';
    backBtn.onclick=function(){history.back()};
    hdr.style.position='relative';
    hdr.style.paddingLeft='48px';
    hdr.appendChild(backBtn);
  }
  // generic in-page navigation links (more / all / quick links)
  var goLinks=document.querySelectorAll('#app [data-go]');
  for(var m=0;m<goLinks.length;m++){
    (function(el){
      el.addEventListener('click',function(e){
        if(isDirty()&&!confirm(_dirtyMsg)){e.preventDefault();e.stopPropagation();return}
        e.stopPropagation();go(el.getAttribute('data-go'));
      });
    })(goLinks[m]);
  }
  window.scrollTo(0,0);
}
// _navConfirmed: go() 已通过 dirty 检查，hashchange 无需再 confirm
var _navConfirmed=false;
function go(path){
  if(location.hash==='#'+path)return;
  if(isDirty()&&!confirm(_dirtyMsg))return;
  _navConfirmed=true;
  clearDirty();
  location.hash='#'+path;
}
window.addEventListener('beforeunload',function(e){
  if(isDirty()){e.preventDefault();e.returnValue=_dirtyMsg;return _dirtyMsg}
});
window.addEventListener('hashchange',function(e){
  // go() 发起的导航已通过 dirty 检查，直接渲染
  if(_navConfirmed){
    _navConfirmed=false;
    var h=location.hash.slice(1)||'/home';
    route(h);
    return;
  }
  // 浏览器后退/前进：检查 dirty
  if(isDirty()){
    if(!confirm(_dirtyMsg)){
      // 用户取消，恢复旧 URL（replaceState 不触发 hashchange）
      var oldHash=e.oldURL&&e.oldURL.indexOf('#')>=0?e.oldURL.slice(e.oldURL.indexOf('#')):'#/home';
      history.replaceState(null,'',oldHash);
      return;
    }
    clearDirty();
  }
  var h2=location.hash.slice(1)||'/home';
  route(h2);
});

/* ========================= Tabbar ========================= */
function renderTabbar(activeKey){
  var tabs=[
    {key:'/home',icon:'🏠',name:'首页',match:['/home']},
    {key:'/patients',icon:'👥',name:'患者',match:['/patients','/patient']},
    {key:'/assessment',icon:'📝',name:'评估',match:['/assessment','/special-exam','/scales']},
    {key:'/plan',icon:'📋',name:'方案',match:['/plan']},
    {key:'/report',icon:'📊',name:'报告',match:['/report','/records','/record','/stats']},
    {key:'/settings',icon:'⚙️',name:'设置',match:['/settings']}
  ];
  // derive first segment of activeKey (e.g. '/patient/:id' -> '/patient')
  var seg=activeKey||'/home';
  var segParts=seg.split('/:'); // '/patient/:id' -> ['/patient','id']
  var baseSeg=segParts[0];
  var html='<div id="tabbar">';
  for(var i=0;i<tabs.length;i++){
    var t=tabs[i];
    var on='';
    for(var m=0;m<t.match.length;m++){
      if(baseSeg===t.match[m]){on='on';break}
    }
    html+='<div class="tab '+on+'" data-go="'+t.key+'"><span class="ic">'+t.icon+'</span><span>'+t.name+'</span></div>';
  }
  html+='</div>';
  document.getElementById('tabbar').outerHTML=html;
  // bind
  var els=document.querySelectorAll('#tabbar .tab');
  for(var j=0;j<els.length;j++){
    (function(el){
      el.onclick=function(){go(el.getAttribute('data-go'))};
    })(els[j]);
  }
}

routes['/camera']=function(param,query){
  var patients=getPatients();
  var t=getTherapist();
  if(patients.length===0){
    app.innerHTML='<div class="page"><div class="page-header"><h2>拍照记录</h2></div><div class="empty"><div class="ei">👥</div>请先添加患者</div><button class="btn" data-go="/patients">去添加患者</button></div>';
    var b=document.querySelector('[data-go="/patients"]');if(b)b.onclick=function(){go('/patients')};
    return;
  }
  var profiles=getProfiles();
  var activeProfile=getActiveProfile()||profiles[0]||{id:'',name:t.name,department:t.department,role:t.role};
  var presetType=query.type||TREATMENT_TYPES[0];
  var presetPid=query.pid||'';

  var opts='';
  patients.forEach(function(p){opts+='<option value="'+p.id+'"'+(p.id===presetPid?' selected':'')+'>'+escapeHtml(p.name)+'</option>'});
  var topts='';
  // 治疗类型从东营市项目中选择
  getDYCategories().forEach(function(cat){
    topts+='<optgroup label="'+escapeHtml(cat)+'">';
    getDYItemsByCategory(cat).forEach(function(it){
      topts+='<option value="'+escapeHtml(it.name)+'">'+escapeHtml(it.name)+'</option>';
    });
    topts+='</optgroup>';
  });
  topts+='<option value="其他">其他</option>';
  // 地点预设
  var LOCATIONS=['康复大厅','作业治疗室','言语治疗室','康复门诊','病房','物理治疗室','理疗室'];
  var savedLocs=LS.get('customLocations')||[];
  var allLocs=LOCATIONS.concat(savedLocs);
  var idopts='';
  if(profiles.length===0){
    idopts='<option value="">'+escapeHtml(t.name||'(未设置)')+'</option>';
  }else{
    profiles.forEach(function(p){idopts+='<option value="'+p.id+'"'+(p.id===activeProfile.id?' selected':'')+'>'+escapeHtml(p.name||'(未命名)')+(p.department?' · '+escapeHtml(p.department):'')+'</option>'});
  }

  // default time rounded to half hour
  var nowTs=roundToHalfHour(Date.now());
  var dval=new Date(nowTs);
  var dvalStr=dval.getFullYear()+'-'+pad(dval.getMonth()+1)+'-'+pad(dval.getDate())+'T'+pad(dval.getHours())+':'+pad(dval.getMinutes());

  app.innerHTML='<div class="page"><div class="page-header"><h2>拍照记录</h2><p>拍摄治疗过程并自动加水印</p></div>'+
    '<div class="card">'+
    '<div class="form-group"><label>当前身份</label><select id="cam_identity" '+(profiles.length===0?'disabled':'')+'>'+idopts+'</select></div>'+
    '<div class="form-group"><label>选择患者</label><select id="cam_pid">'+opts+'</select></div>'+
    '<div class="form-group"><label>治疗类型</label><select id="cam_type">'+topts+'</select></div>'+
    '<div class="form-group"><label>地点</label><select id="cam_loc_sel"><option value="">请选择地点</option>'+allLocs.map(function(l){return '<option value="'+escapeHtml(l)+'">'+escapeHtml(l)+'</option>'}).join('')+'<option value="__custom">+ 自定义添加...</option></select></div>'+
    '<div class="form-group" id="cam_loc_custom_wrap" style="display:none"><label>自定义地点</label><div style="display:flex;gap:8px"><input id="cam_loc_custom" placeholder="输入地点名称"><button class="btn btn-ghost" id="cam_loc_add" style="white-space:nowrap">添加</button></div></div>'+
    '<div class="form-group" id="cam_loc_manual_wrap" style="display:none"><label>地点（手动输入）</label><input id="cam_loc" value="" placeholder="输入地点"></div>'+
    '<div class="form-group"><label>治疗师姓名</label><input id="cam_th" value="'+escapeHtml(t.name)+'" placeholder="治疗师姓名"></div>'+
    '<div class="form-group"><label>治疗时间</label><input type="datetime-local" id="cam_time" value="'+dvalStr+'"></div>'+
    '<button class="btn" id="cam_shoot">📷 拍照</button>'+
    '<input type="file" id="cam_file" accept="image/*" capture="environment" style="display:none">'+
    '</div>'+
    '<div class="card" id="cam_preview_wrap" style="display:none">'+
    '<div class="card-title">预览（已加水印）</div>'+
    '<img class="photo-preview" id="cam_preview_img">'+
    '<div style="display:flex;gap:8px">'+
    '<button class="btn" id="cam_save" style="flex:1">💾 保存记录</button>'+
    '<button class="btn btn-ghost" id="cam_update" style="flex:1">🔄 更新水印</button>'+
    '</div>'+
    '<button class="btn btn-ghost" id="cam_reshoot" style="margin-top:8px">重新拍摄</button>'+
    '</div></div>';

  var fileInput=document.getElementById('cam_file');

  // location select handler
  var locSel=document.getElementById('cam_loc_sel');
  if(locSel){
    locSel.onchange=function(){
      var customWrap=document.getElementById('cam_loc_custom_wrap');
      var manualWrap=document.getElementById('cam_loc_manual_wrap');
      if(this.value==='__custom'){
        customWrap.style.display='';
        manualWrap.style.display='';
        var ci=document.getElementById('cam_loc_custom');
        if(ci)ci.focus();
      }else{
        customWrap.style.display='none';
        manualWrap.style.display='none';
      }
    };
  }
  // add custom location
  var locAddBtn=document.getElementById('cam_loc_add');
  if(locAddBtn){
    locAddBtn.onclick=function(){
      var ci=document.getElementById('cam_loc_custom');
      var val=ci?ci.value.trim():'';
      if(!val){toast('请输入地点名称');return}
      var saved=LS.get('customLocations')||[];
      if(saved.indexOf(val)<0&&LOCATIONS.indexOf(val)<0){
        saved.push(val);
        LS.set('customLocations',saved);
      }
      // add to select
      var opt=document.createElement('option');
      opt.value=val;opt.textContent=val;
      locSel.insertBefore(opt,locSel.querySelector('option[value="__custom"]'));
      locSel.value=val;
      document.getElementById('cam_loc_custom_wrap').style.display='none';
      document.getElementById('cam_loc_manual_wrap').style.display='none';
      ci.value='';
      toast('地点已添加：'+val);
    };
  }

  // identity change -> update therapist name input
  var idSel=document.getElementById('cam_identity');
  if(idSel){
    idSel.onchange=function(){
      var pid=this.value;
      var ps=getProfiles();
      for(var i=0;i<ps.length;i++){if(ps[i].id===pid){
        document.getElementById('cam_th').value=ps[i].name||'';
        break;
      }}
    };
  }

  // read current form values
  function readForm(){
    var pid=document.getElementById('cam_pid').value;
    var pname='';
    var ps=getPatients();
    for(var i=0;i<ps.length;i++){if(ps[i].id===pid){pname=ps[i].name;break}}
    var type=document.getElementById('cam_type').value;
    var locSel=document.getElementById('cam_loc_sel');
    var loc='';
    if(locSel.value==='__custom'){
      var manualInput=document.getElementById('cam_loc');
      loc=manualInput?manualInput.value.trim():'';
    }else{
      loc=locSel.value||'未填写';
    }
    var th=document.getElementById('cam_th').value.trim()||'未填写';
    var tval=document.getElementById('cam_time').value;
    var ts;
    if(tval){
      var dd=new Date(tval);
      ts=isNaN(dd.getTime())?roundToHalfHour(Date.now()):dd.getTime();
    }else{
      ts=roundToHalfHour(Date.now());
    }
    var rno=genRecordNo(ts);
    return {pid:pid,pname:pname,type:type,loc:loc,th:th,ts:ts,rno:rno};
  }

  // encapsulated capture + watermark function (reusable for "update watermark")
  function captureAndWatermark(file){
    if(!file){toast('请先拍照');return}
    var fr=new FileReader();
    fr.onload=function(){
      var f=readForm();
      toast('正在生成水印...');
      addWatermark(fr.result,{
        datetime:fmtTimeShort(f.ts),location:f.loc,therapist:f.th,patient:f.pname,type:f.type,recordNo:f.rno
      },function(blob,dataURL){
        pendingCapture={blob:blob,dataURL:dataURL,file:file,imgURL:fr.result,pid:f.pid,pname:f.pname,type:f.type,loc:f.loc,th:f.th,ts:f.ts,rno:f.rno};
        var prevImg=document.getElementById('cam_preview_img');
        if(prevImg)prevImg.src=dataURL;
        var wrap=document.getElementById('cam_preview_wrap');
        if(wrap)wrap.style.display='block';
        toast('水印已生成');
      });
    };
    fr.readAsDataURL(file);
  }

  document.getElementById('cam_shoot').onclick=function(){fileInput.click()};
  document.getElementById('cam_reshoot').onclick=function(){fileInput.click()};
  fileInput.onchange=function(e){
    var file=e.target.files[0];
    if(!file)return;
    captureAndWatermark(file);
    fileInput.value=''; // allow re-pick same file
  };
  document.getElementById('cam_update').onclick=function(){
    if(!pendingCapture||!pendingCapture.file){toast('请先拍照');return}
    captureAndWatermark(pendingCapture.file);
  };
  document.getElementById('cam_save').onclick=function(){
    if(!pendingCapture){toast('请先拍照');return}
    // auto-update watermark if form changed before save
    var f=readForm();
    var needUpdate=(f.pid!==pendingCapture.pid||f.pname!==pendingCapture.pname||f.type!==pendingCapture.type||
                    f.loc!==pendingCapture.loc||f.th!==pendingCapture.th||f.ts!==pendingCapture.ts||f.rno!==pendingCapture.rno);
    var doSave=function(){
      var c=pendingCapture;
      var rec={id:uid(),recordNo:c.rno,patientId:c.pid,patientName:c.pname,therapistName:c.th,treatmentType:c.type,location:c.loc,timestamp:c.ts,photoId:null};
      // 1. 先写记录（photoId=null 占位），LS 失败则直接报错，不产生孤儿照片
      var rs=getRecords();
      rs.push(rec);
      if(!setRecords(rs)){
        toast('⚠️ 保存失败：存储空间不足');
        return Promise.resolve();
      }
      // 2. 再异步写照片到 IDB
      return DB.putPhoto(rec.id,c.blob).then(function(){
        // 3. 照片成功，更新记录的 photoId
        rec.photoId=rec.id;
        var rs2=getRecords();
        for(var i=0;i<rs2.length;i++){if(rs2[i].id===rec.id){rs2[i].photoId=rec.id;break}}
        setRecords(rs2);
        pendingCapture=null;
        toast('已保存记录');
        go('/record/'+rec.id);
      }).catch(function(err){
        // 照片写入失败，但记录已保存（photoId=null），用户可重新拍照
        pendingCapture=null;
        toast('记录已保存，但照片存储失败：'+(err&&err.message||''));
        go('/record/'+rec.id);
      });
    };
    if(needUpdate&&pendingCapture.file){
      // regenerate then save
      return new Promise(function(resolve,reject){
        var fr=new FileReader();
        fr.onload=function(){
          addWatermark(fr.result,{
            datetime:fmtTimeShort(f.ts),location:f.loc,therapist:f.th,patient:f.pname,type:f.type,recordNo:f.rno
          },function(blob,dataURL){
            pendingCapture={blob:blob,dataURL:dataURL,file:pendingCapture.file,imgURL:fr.result,pid:f.pid,pname:f.pname,type:f.type,loc:f.loc,th:f.th,ts:f.ts,rno:f.rno};
            doSave().then(resolve,reject);
          });
        };
        fr.readAsDataURL(pendingCapture.file);
      });
    }else{
      return doSave();
    }
  };
  wrapSave('cam_save');
};

function saveCertImage(r,hash){
  var W=400,H=620;
  var canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#3182ce';ctx.fillRect(0,0,W,8);
  ctx.fillStyle='#3182ce';ctx.font='700 20px sans-serif';ctx.textAlign='center';
  ctx.fillText('治疗记录真实性证明',W/2,50);
  ctx.textAlign='left';ctx.fillStyle='#333';ctx.font='14px sans-serif';
  var rows=[['记录编号',r.recordNo],['治疗师',r.therapistName],['患者',r.patientName],['治疗时间',fmtTime(r.timestamp)],['地点',r.location],['治疗类型',r.treatmentType],['验证码',hash]];
  var y=90;
  rows.forEach(function(row){
    ctx.fillStyle='#888';ctx.fillText(row[0],40,y);
    ctx.fillStyle='#333';ctx.fillText(String(row[1]),140,y);
    y+=30;
  });
  // qr
  var qrC=document.createElement('canvas');qrC.width=160;qrC.height=160;
  drawQR(qrC,r.recordNo+'|'+r.patientName+'|'+r.timestamp+'|'+hash);
  ctx.drawImage(qrC,(W-160)/2,y+10,160,160);
  ctx.fillStyle='#999';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText('治疗师拍照记录系统',W/2,H-20);
  canvas.toBlob(function(blob){
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='cert_'+r.recordNo+'.png';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){try{URL.revokeObjectURL(url)}catch(_){}},5000);
    toast('证明图片已下载');
  });
}

/* ---- Stats ---- */
routes['/stats']=function(){
  var records=getRecords();
  var patients=getPatients();
  var today=todayStr();
  var todayCount=records.filter(function(r){return fmtDate(r.timestamp)===today}).length;

  // type distribution
  var typeCount={};
  TREATMENT_TYPES.forEach(function(t){typeCount[t]=0});
  records.forEach(function(r){if(typeCount[r.treatmentType]!=null){typeCount[r.treatmentType]++}});
  var maxType=Math.max.apply(null,Object.keys(typeCount).map(function(k){return typeCount[k]}));
  var typeBars='';
  TREATMENT_TYPES.forEach(function(t){
    var pct=maxType>0?Math.round(typeCount[t]/maxType*100):0;
    typeBars+='<div class="hbar"><div class="nl">'+t+'</div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><div class="nm">'+typeCount[t]+'</div></div>';
  });

  // 7 day trend
  var dayLabels=[];var dayCounts=[];
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var ds=fmtDate(d.getTime());
    dayLabels.push(pad(d.getMonth()+1)+'-'+pad(d.getDate()));
    dayCounts.push(records.filter(function(r){return fmtDate(r.timestamp)===ds}).length);
  }
  var maxDay=Math.max.apply(null,dayCounts.concat([1]));
  var dayBars='';
  for(var j=0;j<7;j++){
    var h=Math.round(dayCounts[j]/maxDay*100);
    dayBars+='<div class="bar-col" style="height:'+(h<6?6:h)+'%"><span class="val">'+dayCounts[j]+'</span><span class="lab">'+dayLabels[j]+'</span></div>';
  }

  app.innerHTML='<div class="page"><div class="page-header"><h2>统计分析</h2><p>数据概览与趋势</p></div>'+
    '<div class="stat-grid"><div class="stat-box"><div class="num">'+todayCount+'</div><div class="lbl">今日记录</div></div><div class="stat-box"><div class="num">'+records.length+'</div><div class="lbl">累计记录</div></div><div class="stat-box"><div class="num">'+patients.length+'</div><div class="lbl">患者总数</div></div></div>'+
    '<div class="card"><div class="card-title">日期范围筛选</div><div class="filter-row"><div class="form-group"><label>开始</label><input class="date-input" type="date" id="st_start"></div><div class="form-group"><label>结束</label><input class="date-input" type="date" id="st_end"></div><button class="btn-mini" id="st_filter" style="height:34px">筛选</button></div><div id="st_result" style="font-size:13px;color:#666"></div></div>'+
    '<div class="card"><div class="card-title">治疗类型分布</div>'+typeBars+'</div>'+
    '<div class="card"><div class="card-title">近7天记录趋势</div><div class="bar-chart">'+dayBars+'</div></div>'+
    '</div>';

  document.getElementById('st_filter').onclick=function(){
    var s=document.getElementById('st_start').value;
    var e=document.getElementById('st_end').value;
    if(!s||!e){toast('请选择日期');return}
    var cnt=records.filter(function(r){var d=fmtDate(r.timestamp);return d>=s&&d<=e}).length;
    document.getElementById('st_result').innerHTML='筛选范围 <b>'+s+'</b> 至 <b>'+e+'</b>，共 <b style="color:var(--primary)">'+cnt+'</b> 条记录';
  };
};

/* profile form modal (add/edit identity) */
function showProfileForm(id){
  var p={name:'',department:'',role:''};
  var profiles=getProfiles();
  if(id){for(var i=0;i<profiles.length;i++){if(profiles[i].id===id){p=profiles[i];break}}}
  var mask=document.createElement('div');
  mask.className='modal-mask';
  mask.innerHTML='<div class="modal"><div class="modal-hd"><span>'+(id?'编辑身份':'添加身份')+'</span><span class="close">&times;</span></div>'+
    '<div class="modal-bd">'+
    '<div class="form-group"><label>姓名</label><input id="pf_id_name" value="'+escapeHtml(p.name)+'" placeholder="治疗师姓名"></div>'+
    '<div class="form-group"><label>科室</label><input id="pf_id_dept" value="'+escapeHtml(p.department)+'" placeholder="如：康复科"></div>'+
    '<div class="form-group"><label>角色/职称</label><input id="pf_id_role" value="'+escapeHtml(p.role)+'" placeholder="如：主管治疗师"></div>'+
    '</div><div class="modal-ft"><button class="btn btn-ghost" id="pf_id_cancel">取消</button><button class="btn" id="pf_id_save">保存</button></div></div>';
  document.body.appendChild(mask);
  mask.querySelector('.close').onclick=function(){mask.remove()};
  document.getElementById('pf_id_cancel').onclick=function(){mask.remove()};
  document.getElementById('pf_id_save').onclick=function(){
    var name=document.getElementById('pf_id_name').value.trim();
    var dept=document.getElementById('pf_id_dept').value.trim();
    var role=document.getElementById('pf_id_role').value.trim();
    if(!name){toast('请输入姓名');return}
    var arr=getProfiles();
    if(id){
      for(var i=0;i<arr.length;i++){if(arr[i].id===id){arr[i].name=name;arr[i].department=dept;arr[i].role=role;break}}
    }else{
      var np={id:uid(),name:name,department:dept,role:role};
      arr.push(np);
      // if first profile, set as active
      if(arr.length===1){setActiveProfileId(np.id)}
    }
    if(!setProfiles(arr)){toast('⚠️ 保存失败：存储空间不足');return}
    mask.remove();toast('已保存');route('/settings');
  };
  wrapSave('pf_id_save');
  mask.onclick=function(e){if(e.target===mask)mask.remove()};
}

  var records=getRecords();

function importFullBackup(data){
  // Anti prototype pollution: reject dangerous keys
  var BAD_KEYS={__proto__:1,constructor:1,prototype:1,hasOwnProperty:1,toString:1,valueOf:1};
  function isSafeKey(k){return !BAD_KEYS[k]&&typeof k==='string'&&k.indexOf('__')!==0}
  audit('data.import',{patients:data.patients?data.patients.length:0,records:data.records?data.records.length:0,photos:data.photos?data.photos.length:0});
  // merge: patients by id, records by id, others overwrite by key
  if(data.patients){
    var existing=getPatients();
    var map={};
    existing.forEach(function(p){if(isSafeKey(p.id))map[p.id]=p});
    data.patients.forEach(function(p){if(p&&isSafeKey(p.id))map[p.id]=p});
    setPatients(Object.keys(map).filter(isSafeKey).map(function(k){return map[k]}));
  }
  if(data.records){
    var er=getRecords();var rmap={};
    er.forEach(function(r){if(isSafeKey(r.id))rmap[r.id]=r});
    data.records.forEach(function(r){if(r&&isSafeKey(r.id))rmap[r.id]=r});
    setRecords(Object.keys(rmap).filter(isSafeKey).map(function(k){return rmap[k]}));
  }
  if(data.assessments){var a=getAssessments();Object.keys(data.assessments).filter(isSafeKey).forEach(function(k){a[k]=data.assessments[k]});setAssessments(a)}
  if(data.specialExams){var se=getSpecialExams();Object.keys(data.specialExams).filter(isSafeKey).forEach(function(k){se[k]=data.specialExams[k]});setSpecialExams(se)}
  if(data.scales){var sc=getScales();Object.keys(data.scales).filter(isSafeKey).forEach(function(k){sc[k]=data.scales[k]});setScales(sc)}
  if(data.plans){var pl=getPlans();Object.keys(data.plans).filter(isSafeKey).forEach(function(k){pl[k]=data.plans[k]});setPlans(pl)}
  if(data.profiles){var pr=getProfiles();var pmap={};pr.forEach(function(p){if(isSafeKey(p.id))pmap[p.id]=p});data.profiles.forEach(function(p){if(p&&isSafeKey(p.id))pmap[p.id]=p});setProfiles(Object.keys(pmap).filter(isSafeKey).map(function(k){return pmap[k]}))}
  if(data.customExams){var ce=getCustomExams();data.customExams.forEach(function(e){var found=ce.some(function(x){return x.name===e.name&&x.category===e.category});if(!found)ce.push(e)});setCustomExams(ce)}
  if(data.customScales){var cs=getCustomScales();data.customScales.forEach(function(s){var found=cs.some(function(x){return x.name===s.name});if(!found)cs.push(s)});setCustomScales(cs)}
  // import photos (async, race-safe via Promise.allSettled)
  if(data.photos&&data.photos.length){
    var valid=data.photos.filter(function(ph){return ph&&isSafeKey(ph.id)&&ph.dataURL});
    var skipped=data.photos.length-valid.length;
    if(valid.length>0){
      toast('正在导入'+valid.length+'张照片...');
      var promises=valid.map(function(ph){
        var blob=dataURLToBlob(ph.dataURL);
        return DB.putPhoto(ph.id,blob);
      });
      Promise.allSettled(promises).then(function(results){
        var ok=0,fail=0;
        results.forEach(function(r){if(r.status==='fulfilled')ok++;else fail++});
        var msg='已导入'+ok+'张照片';
        if(fail>0)msg+='（'+fail+'张失败）';
        if(skipped>0)msg+='（跳过'+skipped+'张无效）';
        toast(msg);
      });
    }else if(skipped>0){
      toast('已导入数据（跳过'+skipped+'张无效照片）');
    }
  }
}

routes['/assessment']=function(){renderPatientPicker('评估','选择患者进入评估流程',function(pid){go('/assessment/'+pid)})};

/* in-memory state for dynamic lists during assessment editing */
var assessState={rom:[],muscle:[]};

    '<div class="section-card" id="as_muscle"><div class="sc-hd"><span>肌力评估</span><span class="arrow">▾</span></div><div class="sc-bd">'+

    '<div class="section-card" id="as_skin"><div class="sc-hd"><span>皮温</span><span class="arrow">▾</span></div><div class="sc-bd">'+
      '<div class="form-group"><label>左侧温度 (°C)</label><input type="number" step="0.1" id="sk_left" value="'+escapeHtml(skinT.left)+'" placeholder="如：36.5"></div>'+

      '<div id="sk_diff"></div>'+

    '<div class="section-card" id="as_adl"><div class="sc-hd"><span>ADL 日常生活活动</span><span class="arrow">▾</span></div><div class="sc-bd">'+

    '<button class="btn btn-ghost" data-go="/patient/'+id+'" style="margin-top:8px">返回患者详情</button>'+
    '</div>';

  // 默认全部展开（按用户文档：所有评估项汇总展示，便于一次录完）

  // 快速跳转 chips：滚动定位到对应 section

    el.onclick=function(){
      var targetId=el.getAttribute('data-jump');
      var target=document.getElementById(targetId);
      if(target){
        // 高亮当前 chip
        document.querySelectorAll('#as_quick_jump .pill').forEach(function(e2){e2.classList.remove('on')});
        el.classList.add('on');
        target.scrollIntoView({behavior:'smooth',block:'start'});
        // 短暂闪烁边框提示
        target.style.transition='box-shadow .3s';
        target.style.boxShadow='0 0 0 3px var(--primary)';
        setTimeout(function(){target.style.boxShadow=''},1200);

  // section 标题点击可折叠/展开（保留单模块收起能力）
  document.querySelectorAll('.section-card .sc-hd').forEach(function(hd){
    hd.style.cursor='pointer';
    hd.onclick=function(){
      var card=hd.parentElement;
      var bd=card.querySelector('.sc-bd');
      if(bd.style.display==='none'){bd.style.display='';hd.querySelector('.arrow').textContent='▾'}
      else{bd.style.display='none';hd.querySelector('.arrow').textContent='▸'}
    };
  });
  // palpation pills
  var palSites=pal.sites.slice();
  document.querySelectorAll('#pal_sites .pill').forEach(function(el){
    el.onclick=function(){
      var s=el.getAttribute('data-site');
      var idx=palSites.indexOf(s);
      if(idx>=0){palSites.splice(idx,1);el.classList.remove('on')}
      else{palSites.push(s);el.classList.add('on')}
    };
  });
  // pain slider
  var painInput=document.getElementById('pal_pain');
  painInput.oninput=function(){document.getElementById('pal_pain_v').textContent=this.value};

  // 主诉：症状多选 chips（点击追加到 textarea）
  var symInput=document.getElementById('as_symptoms');
  document.querySelectorAll('#cc_symptoms_chips .pill').forEach(function(el){
    el.onclick=function(){
      var s=el.getAttribute('data-sym');
      var cur=symInput.value.trim();
      // 单选模式：点击高亮，再次点取消；textarea 同步追加
      var isOn=el.classList.contains('on');
      document.querySelectorAll('#cc_symptoms_chips .pill').forEach(function(e2){e2.classList.remove('on')});
      if(isOn){
        // 取消：从 textarea 中移除该症状
        symInput.value=cur.replace(new RegExp('，?'+s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'，?'),'').replace(/^，|，$/,'').trim();
      }else{
        el.classList.add('on');
        symInput.value=cur?cur+'，'+s:s;
      }
      symInput.focus();
    };
  });
  // 主诉：发病时间单选 chips
  var onsetInput=document.getElementById('as_onset');
  document.querySelectorAll('#cc_onset_chips .pill').forEach(function(el){
    el.onclick=function(){
      var s=el.getAttribute('data-onset');
      document.querySelectorAll('#cc_onset_chips .pill').forEach(function(e2){e2.classList.remove('on')});
      if(onsetInput.value===s){
        onsetInput.value='';el.classList.remove('on');
      }else{
        el.classList.add('on');onsetInput.value=s;
      }
    };
  });
  // 主诉：诱因单选 chips
  var trigInput=document.getElementById('as_triggers');
  document.querySelectorAll('#cc_triggers_chips .pill').forEach(function(el){
    el.onclick=function(){
      var s=el.getAttribute('data-trigger');
      document.querySelectorAll('#cc_triggers_chips .pill').forEach(function(e2){e2.classList.remove('on')});
      if(trigInput.value===s){
        trigInput.value='';el.classList.remove('on');
      }else{
        el.classList.add('on');trigInput.value=s;
      }
    };
  });
  // textarea 手动输入时，清掉对应 chips 高亮（避免状态错乱）
  symInput.oninput=function(){
    document.querySelectorAll('#cc_symptoms_chips .pill').forEach(function(e2){e2.classList.remove('on')});
  };
  onsetInput.oninput=function(){
    document.querySelectorAll('#cc_onset_chips .pill').forEach(function(e2){e2.classList.remove('on')});
  };
  trigInput.oninput=function(){
    document.querySelectorAll('#cc_triggers_chips .pill').forEach(function(e2){e2.classList.remove('on')});
  };

  // ROM render
  function renderRom(){
    var wrap=document.getElementById('rom_list');
    var html='';
    assessState.rom.forEach(function(r,idx){
      html+='<div class="dyn-item"><div class="di-hd"><span>关节：'+escapeHtml(r.joint||'未选')+'</span><span class="di-rm" data-rm-rom="'+idx+'">删除</span></div>'+
        '<div class="rom-row"><div class="rom-cell"><label>关节</label><select data-rom-joint="'+idx+'">'+ROM_JOINTS.map(function(j){return '<option value="'+j+'"'+(r.joint===j?' selected':'')+'>'+j+'</option>'}).join('')+'</select></div>'+
        '<div class="rom-cell"><label>主动活动度</label><input placeholder="屈/伸/外展..." value="'+escapeHtml(r.active||'')+'" data-rom-active="'+idx+'"></div>'+
        '<div class="rom-cell"><label>被动活动度</label><input placeholder="数值" value="'+escapeHtml(r.passive||'')+'" data-rom-passive="'+idx+'"></div></div></div>';
    });
    wrap.innerHTML=html||'<div style="color:#aaa;font-size:12px;text-align:center;padding:8px">暂无关节记录</div>';
    wrap.querySelectorAll('[data-rm-rom]').forEach(function(el){el.onclick=function(){assessState.rom.splice(+el.getAttribute('data-rm-rom'),1);renderRom()}});
    wrap.querySelectorAll('[data-rom-joint]').forEach(function(el){el.onchange=function(){assessState.rom[+el.getAttribute('data-rom-joint')].joint=el.value}});
    wrap.querySelectorAll('[data-rom-active]').forEach(function(el){el.oninput=function(){assessState.rom[+el.getAttribute('data-rom-active')].active=el.value}});
    wrap.querySelectorAll('[data-rom-passive]').forEach(function(el){el.oninput=function(){assessState.rom[+el.getAttribute('data-rom-passive')].passive=el.value}});
  }
  document.getElementById('rom_add').onclick=function(){assessState.rom.push({joint:ROM_JOINTS[0],active:'',passive:''});renderRom()};
  renderRom();

  // muscle render
  function renderMuscle(){
    var wrap=document.getElementById('muscle_list');
    var html='';
    assessState.muscle.forEach(function(m,idx){
      var gradeHtml='';
      for(var g=0;g<=5;g++){
        gradeHtml+='<label'+(m.grade==g?' style="background:var(--primary);color:#fff"':'')+'><input type="radio" name="mg_'+idx+'" value="'+g+'" '+(m.grade==g?'checked':'')+'> '+g+'级</label>';
      }
      html+='<div class="dyn-item"><div class="di-hd"><span>'+escapeHtml(m.group||'未选')+'</span><span class="di-rm" data-rm-muscle="'+idx+'">删除</span></div>'+
        '<div class="form-group"><label>肌群</label><select data-muscle-group="'+idx+'">'+MUSCLE_GROUPS.map(function(g2){return '<option value="'+g2+'"'+(m.group===g2?' selected':'')+'>'+g2+'</option>'}).join('')+'</select></div>'+
        '<div class="form-group"><label>肌力等级 (0-5)</label><div class="pill-group">'+gradeHtml+'</div></div>'+
        '<div class="form-group"><label>备注</label><input value="'+escapeHtml(m.note||'')+'" data-muscle-note="'+idx+'"></div></div>';
    });
    wrap.innerHTML=html||'<div style="color:#aaa;font-size:12px;text-align:center;padding:8px">暂无肌力记录</div>';
    wrap.querySelectorAll('[data-rm-muscle]').forEach(function(el){el.onclick=function(){assessState.muscle.splice(+el.getAttribute('data-rm-muscle'),1);renderMuscle()}});
    wrap.querySelectorAll('[data-muscle-group]').forEach(function(el){el.onchange=function(){assessState.muscle[+el.getAttribute('data-muscle-group')].group=el.value;renderMuscle()}});
    wrap.querySelectorAll('[data-muscle-note]').forEach(function(el){el.oninput=function(){assessState.muscle[+el.getAttribute('data-muscle-note')].note=el.value}});
    wrap.querySelectorAll('input[type=radio][name^=mg_]').forEach(function(el){
      el.onchange=function(){
        var idx=+el.name.split('_')[1];
        assessState.muscle[idx].grade=+el.value;
        renderMuscle();
      };
    });
  }
  document.getElementById('muscle_add').onclick=function(){assessState.muscle.push({group:MUSCLE_GROUPS[0],grade:0,note:''});renderMuscle()};
  renderMuscle();

  // skin temp diff
  var skL=document.getElementById('sk_left'),skR=document.getElementById('sk_right');
  function calcSkinDiff(){
    var l=parseFloat(skL.value),r=parseFloat(skR.value);
    var box=document.getElementById('sk_diff');
    if(isNaN(l)||isNaN(r)){box.innerHTML='';return}
    var diff=Math.abs(l-r);
    var cls=diff>2?'danger':'info';
    var msg=diff>2?'⚠ 温差过大（>2°C），提示异常':'温差 '+diff.toFixed(1)+'°C，正常范围内';
    box.innerHTML='<div class="alert '+cls+'">'+msg+'</div>';
  }
  skL.oninput=calcSkinDiff;skR.oninput=calcSkinDiff;calcSkinDiff();

  // ADL render
  var adlData=adl.items||{};
  function renderAdl(){
    var wrap=document.getElementById('adl_list');
    var html='';
    ADL_ITEMS.forEach(function(item){
      var cur=adlData[item];
      html+='<div class="sub-section"><div class="ss-title">'+item+'</div><div class="pill-group">'+
        [{l:'独立(0)',v:0},{l:'需协助(1)',v:1},{l:'不能(2)',v:2}].map(function(o){
          return '<span class="pill'+(cur===o.v?' on':'')+'" data-adl="'+item+'" data-v="'+o.v+'">'+o.l+'</span>';
        }).join('')+'</div></div>';
    });
    wrap.innerHTML=html;
    wrap.querySelectorAll('.pill[data-adl]').forEach(function(el){
      el.onclick=function(){
        adlData[el.getAttribute('data-adl')]=+el.getAttribute('data-v');
        renderAdl();calcAdlTotal();
      };
    });
  }
  function calcAdlTotal(){
    var total=0,count=0;
    ADL_ITEMS.forEach(function(it){if(adlData[it]!=null){total+=adlData[it];count++}});
    var box=document.getElementById('adl_total');
    if(count===0){box.textContent='';return}
    var pct=Math.round((1-total/(count*2))*100);
    var lvl=pct>=80?'独立':(pct>=50?'轻度依赖':(pct>=20?'中度依赖':'重度依赖'));
    box.textContent='ADL总分：'+total+' / 独立程度：'+pct+'% ('+lvl+')';
  }
  renderAdl();calcAdlTotal();

  // save
  document.getElementById('as_save').onclick=function(){
    var data={
      chiefComplaint:{
        symptoms:document.getElementById('as_symptoms').value.trim(),
        onset:document.getElementById('as_onset').value.trim(),
        triggers:document.getElementById('as_triggers').value.trim(),
        history:document.getElementById('as_history').value.trim()
      },
      palpation:{
        sites:palSites,
        painLevel:+document.getElementById('pal_pain').value,
        findings:document.getElementById('pal_findings').value.trim()
      },
      rom:JSON.parse(JSON.stringify(assessState.rom)),
      muscle:JSON.parse(JSON.stringify(assessState.muscle)),
      skinTemp:{left:document.getElementById('sk_left').value.trim(),right:document.getElementById('sk_right').value.trim()},
      adl:{items:adlData}
    };
    clearDirty();
    if(!setAssessment(id,data)){toast('⚠️ 保存失败：存储空间不足');markDirty('form');return}
    toast('评估已保存');
  };
  wrapSave('as_save');
  bindDirtyGuard('app');
};

/* ==================== Task 3: Special Exam Module ==================== */
routes['/special-exam']=function(){renderPatientPicker('特殊检查','选择患者进行特殊检查',function(pid){go('/special-exam/'+pid)})};

routes['/special-exam/:id']=function(id){
  var p=getPatient(id);
  if(!p){app.innerHTML='<div class="page"><div class="empty"><div class="ei">❓</div>患者不存在</div><button class="btn" data-go="/patients">返回</button></div>';return}
  var custom=getCustomExams();
  var allExams=SPECIAL_EXAMS.concat(custom);
  // existing results: map name-> {result,note}
  var existing=getSpecialExamList(id);
  var resultMap={};
  existing.forEach(function(e){resultMap[e.examName]={result:e.result,note:e.note}});
  // group by category
  var cats={};
  allExams.forEach(function(e,idx){if(!cats[e.category])cats[e.category]=[];cats[e.category].push({exam:e,idx:idx})});

  var bodyHtml='';
  Object.keys(cats).forEach(function(cat){
    bodyHtml+='<div class="cat-group"><div class="cat-title">'+escapeHtml(cat)+'</div>';
    cats[cat].forEach(function(item){
      var e=item.exam;var idx=item.idx;
      var cur=resultMap[e.name]||{result:'unchecked',note:''};
      var resultHtml=EXAM_RESULTS.map(function(r){
        return '<label class="'+r.cls+(cur.result===r.val?' checked':'')+'" data-res="'+r.val+'"><input type="radio" name="ex_'+idx+'" value="'+r.val+'" '+(cur.result===r.val?'checked':'')+'><span>'+r.label+'</span></label>';
      }).join('');
      bodyHtml+='<div class="exam-row"><div class="ex-name">'+escapeHtml(e.name)+'</div>'+
        '<div class="ex-result">'+resultHtml+'</div>'+
        '<input class="ex-note" placeholder="备注" value="'+escapeHtml(cur.note||'')+'" data-note="'+idx+'">'+
        '</div>';
    });
    bodyHtml+='</div>';
  });

  app.innerHTML='<div class="page no-print">'+
    '<div class="page-header"><h2>特殊检查</h2><p>'+escapeHtml(p.name)+'</p></div>'+
    '<div class="card">'+bodyHtml+'</div>'+
    '<div class="card"><div class="card-title">自定义检查项</div>'+
      '<div class="form-group"><label>名称</label><input id="ce_name" placeholder="检查项目名称"></div>'+
      '<div class="form-group"><label>分类</label><input id="ce_cat" placeholder="如：肩关节"></div>'+
      '<button class="btn btn-ghost" id="ce_add">+ 添加自定义检查项</button>'+
    '</div>'+
    '<button class="btn" id="se_save" style="margin-top:8px">💾 保存检查结果</button>'+
    '<button class="btn btn-ghost" data-go="/patient/'+id+'" style="margin-top:8px">返回患者详情</button>'+
    '</div>';

  // bind radio pills (visual toggle)
  document.querySelectorAll('.exam-row .ex-result label').forEach(function(lb){
    lb.onclick=function(e){
      e.preventDefault();
      var name=this.parentNode.querySelector('input').name;
      var val=this.getAttribute('data-res');
      // update radio

    var nm=document.getElementById('cs_name').value.trim();
    var ct=document.getElementById('cs_cat').value.trim()||'自定义';
    var qs=document.getElementById('cs_qs').value.trim().split('\n').filter(Boolean);
    if(!nm||qs.length===0){toast('请填写名称和问题');return}
    var questions=qs.map(function(line){
      var parts=line.split(':');
      var text=parts[0].trim();
      var max=parts[1]?parseInt(parts[1],10):3;
      if(isNaN(max)||max<1)max=3;
      return {text:text,maxScore:max};
    });
    var maxTotal=questions.reduce(function(a,b){return a+b.maxScore},0);
    var arr=getCustomScales();
    arr.push({id:uid(),name:nm,category:ct,questions:questions,maxTotal:maxTotal});
    if(!setCustomScales(arr)){toast('⚠️ 保存失败：存储空间不足');return}
    toast('自定义量表已创建');
    route('/scales/'+id);
  };

  // history click - show trend
  document.querySelectorAll('[data-hid]').forEach(function(el){
    el.onclick=function(){
      var date=+el.getAttribute('data-hid');
      var rec=getScaleList(id).filter(function(h){return h.date===date})[0];
      if(rec){
        // find all same scaleType records for trend
        var sameType=getScaleList(id).filter(function(h){return h.scaleType===rec.scaleType}).sort(function(a,b){return a.date-b.date});
        var sd=SCALE_DEFINITIONS[rec.scaleType];
        var libItem=SCALE_LIBRARY.filter(function(x){return x.key===rec.scaleType})[0];
        var sname=sd?sd.name:(libItem?libItem.fullName:rec.scaleType);
        var trendHtml=sameType.map(function(s){return fmtDate(s.date)+': '+s.score+'分'}).join(' → ');
        toast(sname+' 趋势：'+trendHtml);
      }
    };
  });
};
